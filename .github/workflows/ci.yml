name: CI

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]

jobs:
  # The PR title (the squash commit's subject) and its changelog fragment.
  conventions:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - run: bun tools/commits/check.ts pr
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_REF: ${{ github.base_ref }}

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run check
      # ecs-talk and the Mix packages use one odgn-talk commit (ADR 0021)
      - run: bun run check:northtalk

  # The Elixir World (packages/mua_world) builds and tests with Mix alone,
  # without Bun (#102).
  mua-world:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/mua_world
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '28'
          elixir-version: '1.20'
      - uses: actions/cache@v4
        with:
          path: |
            packages/mua_world/deps
            packages/mua_world/_build
          key: mua-world-${{ hashFiles('packages/mua_world/mix.lock', 'packages/odgn_ecs_engine/mix.lock', 'packages/odgn_ecs_talk/mix.lock', 'packages/odgn_edl/mix.lock', 'packages/odgn_ecs/mix.lock') }}
      - run: mix deps.get
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
      - run: mix test

  # The Elixir ECS library (packages/odgn_ecs) builds and tests with Mix
  # alone, without Bun (#96).
  odgn-ecs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/odgn_ecs
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '28'
          elixir-version: '1.20'
      - uses: actions/cache@v4
        with:
          path: |
            packages/odgn_ecs/deps
            packages/odgn_ecs/_build
          key: odgn-ecs-${{ hashFiles('packages/odgn_ecs/mix.lock') }}
      - run: mix deps.get
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
      - run: mix test

  # The Elixir EDL library (packages/odgn_edl) builds and tests with Mix
  # alone, without Bun (#96).
  odgn-edl:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/odgn_edl
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '28'
          elixir-version: '1.20'
      - uses: actions/cache@v4
        with:
          path: |
            packages/odgn_edl/deps
            packages/odgn_edl/_build
          key: odgn-edl-${{ hashFiles('packages/odgn_edl/mix.lock', 'packages/odgn_ecs/mix.lock') }}
      - run: mix deps.get
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
      - run: mix test

  # The NorthTalk Host Adapter (packages/odgn_ecs_talk) builds and tests
  # with Mix alone, without Bun (#112).
  odgn-ecs-talk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/odgn_ecs_talk
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '28'
          elixir-version: '1.20'
      - uses: actions/cache@v4
        with:
          path: |
            packages/odgn_ecs_talk/deps
            packages/odgn_ecs_talk/_build
          key: odgn-ecs-talk-${{ hashFiles('packages/odgn_ecs_talk/mix.lock', 'packages/odgn_edl/mix.lock', 'packages/odgn_ecs/mix.lock') }}
      - run: mix deps.get
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
      - run: mix test

  # The engine (packages/odgn_ecs_engine) builds and tests with Mix alone,
  # without Bun (ADR 0021).
  odgn-ecs-engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/odgn_ecs_engine
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '28'
          elixir-version: '1.20'
      - uses: actions/cache@v4
        with:
          path: |
            packages/odgn_ecs_engine/deps
            packages/odgn_ecs_engine/_build
          key: odgn-ecs-engine-${{ hashFiles('packages/odgn_ecs_engine/mix.lock', 'packages/odgn_ecs_talk/mix.lock', 'packages/odgn_edl/mix.lock', 'packages/odgn_ecs/mix.lock') }}
      - run: mix deps.get
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
      - run: mix test

  # The Phoenix server (packages/mua_server) builds and tests with Mix
  # alone, without Bun (#97).
  mua-server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/mua_server
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '28'
          elixir-version: '1.20'
      - uses: actions/cache@v4
        with:
          path: |
            packages/mua_server/deps
            packages/mua_server/_build
          key: mua-server-${{ hashFiles('packages/mua_server/mix.lock', 'packages/mua_world/mix.lock', 'packages/odgn_ecs_engine/mix.lock', 'packages/odgn_ecs_talk/mix.lock', 'packages/odgn_edl/mix.lock', 'packages/odgn_ecs/mix.lock') }}
      - run: mix deps.get
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
      - run: mix test

  # The browser client's journey, in Chromium against the real server (#104)
  mua-client-e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/mua_client
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '28'
          elixir-version: '1.20'
      - uses: actions/cache@v4
        with:
          path: |
            packages/mua_server/deps
            packages/mua_server/_build
          key: mua-client-e2e-${{ hashFiles('packages/mua_server/mix.lock', 'packages/mua_world/mix.lock', 'packages/odgn_ecs_engine/mix.lock', 'packages/odgn_ecs_talk/mix.lock', 'packages/odgn_edl/mix.lock', 'packages/odgn_ecs/mix.lock') }}
      - run: bun install --frozen-lockfile
        working-directory: .
      - run: bunx playwright install --with-deps chromium
      - run: mix deps.get && mix compile
        working-directory: packages/mua_server
      - run: bun run e2e

  # A Local World's Worker in Chromium: sqlite-wasm in OPFS, NorthTalk and
  # the mua Host (ADR 0023).
  mua-local-e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/mua-local
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
        working-directory: .
      - run: bunx playwright install --with-deps chromium
      - run: bun run e2e

  arcade-e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/arcade
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
        working-directory: .
      - run: bunx playwright install --with-deps chromium
      - run: bun run e2e

  # The alpha's release image builds from a clean checkout (#130). Nothing is
  # pushed.
  release-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: mua:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
